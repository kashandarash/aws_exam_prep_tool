text: |-
    A company is migrating a legacy application to Amazon EC2 instances. The application uses a user name and password that are stored in the source code to connect to a MySQL database. The company will migrate the database to an Amazon RDS for MySQL DB instance. As part of the migration, the company needs to implement a secure way to store and automatically rotate the database credentials.
    Which solution will meet these requirements?
options:
    -
        text: 'Store the database credentials in environment variables in an Amazon Machine Image (AMI). Rotate the credentials by replacing the AMI.'
        correct: false
    -
        text: 'Store the database credentials in AWS Systems Manager Parameter Store. Configure Parameter Store to automatically rotate the credentials.'
        correct: false
    -
        text: 'Store the database credentials in environment variables on the EC2 instances. Rotate the credentials by relaunching the EC2 instances.'
        correct: false
    -
        text: 'Store the database credentials in AWS Secrets Manager. Configure Secrets Manager to automatically rotate the credentials.'
        correct: true
