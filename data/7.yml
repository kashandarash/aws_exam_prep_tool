text: |-
    A global company has a mobile app with static data stored in an Amazon S3 bucket in the us-east-1 Region. The company serves the content through an Amazon
    CloudFront distribution. The company is launching the mobile app in South Africa. The data must reside in the af-south-1 Region. The company does not want to deploy a specific mobile client for South Africa.
    What should the company do to meet these requirements?
options:
    -
        text: 'Use the CloudFront geographic restriction feature to block access to users in South Africa.'
        correct: false
    -
        text: 'Create a Lambda@Edge function. Associate the Lambda@Edge function as an origin request trigger with the CloudFront distribution to change the S3 origin Region.'
        correct: true
    -
        text: 'Create a Lambda@Edge function. Associate the Lambda@Edge function as a viewer response trigger with the CloudFront distribution to change the S3 origin Region.'
        correct: false
    -
        text: 'Include af-south-1 in the alternate domain name (CNAME) of the CloudFront distribution.'
        correct: false
