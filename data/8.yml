text: |-
    A developer is testing an AWS Lambda function by using the AWS Serverless Application Model (AWS SAM) local CLI. The application that is implemented by the
    Lambda function makes several AWS API calls by using the AWS software development kit (SDK). The developer wants to allow the function to make AWS API calls in a test AWS account from the developer's laptop.
    What should the developer do to meet these requirements?
options:
    -
        text: 'Edit the template.yml file. Add the AWS_ACCESS_KEY_ID property and the AWS_SECRET_ACCESS_KEY property in the Globals section.'
        correct: false
    -
        text: 'Add a test profile by using the aws configure command with the --profile option. Run AWS SAM by using the sam local invoke command with the -profile option.'
        correct: true
    -
        text: 'Edit the template.yml tile. For the AWS::Serverless::Function resource, set the role to an IAM role in the AWS account.'
        correct: false
    -
        text: 'Run the function by using the sam local invoke command. Override the AWS_ACCESS_KEY_ID parameter and the AWS_SECRET_ACCESS_KEY parameter by specifying the --parameter-overrides option.'
        correct: false
