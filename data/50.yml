text: |-
    A developer is planning to use an Amazon API Gateway and AWS Lambda to provide a REST API. The developer will have three distinct environments to manage: development, test, and production.
    How should the application be deployed while minimizing the number of resources to manage?
options:
    -
        text: 'Create a separate API Gateway and separate Lambda function for each environment in the same Region.'
        correct: false
    -
        text: 'Assign a Region for each environment and deploy API Gateway and Lambda to each Region.'
        correct: false
    -
        text: 'Create one API Gateway with multiple stages with one Lambda function with multiple aliases.'
        correct: true
    -
        text: 'Create one API Gateway and one Lambda function, and use a REST parameter to identify the environment.'
        correct: false
